name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      LEGALOS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LEGALOS_TEST_S3_ENDPOINT: http://localhost:8333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.32
      - name: Install dependencies
        run: uv sync --frozen
      - name: Start S3-compatible storage (for the storage integration test)
        run: |
          docker run -d --name storage -p 8333:8333 \
            -v "$GITHUB_WORKSPACE/infra/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.00 server -dir=/data -s3 -s3.port=8333 \
            -s3.config=/etc/seaweedfs/s3.json
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Wait for storage
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8333/ && exit 0; sleep 2
          done
          exit 1
      - name: Tests (real Postgres + pgvector, includes tenant-isolation tests)
        run: uv run pytest
      - name: Migrations can be rolled back and re-applied
        env:
          LEGALOS_DATABASE_OWNER_URL: postgresql+psycopg://legalos_test_owner:test_owner_pw@localhost:5432/legalos_test
          LEGALOS_DATABASE_APP_ROLE: legalos_test_app
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: OpenAPI schema committed for the frontend is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../frontend/lib/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Generated API types match the OpenAPI schema
        run: |
          pnpm gen:api
          git diff --exit-code -- lib/api/schema.d.ts
      - name: Build
        run: pnpm build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          pip install uv==0.11.32
          uv export --frozen --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: JavaScript dependencies (pnpm audit)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Images build
        run: |
          cp .env.example .env
          docker compose build
